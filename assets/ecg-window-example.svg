<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">ECG Window example</title>
  <desc id="desc">A small ECG Window panel showing a live activity trace, current percent, and note.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="624" height="164" rx="18" fill="url(#panel)" stroke="#1f2937" stroke-width="2"/>
  <rect x="28" y="28" width="390" height="124" rx="12" fill="#07111f" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M 40 138 L 68 138 L 84 120 L 98 136 L 122 58 L 144 138 L 176 138 L 194 124 L 214 136 L 238 48 L 262 138 L 290 138 L 306 130 L 324 136 L 346 72 L 368 138 L 406 138 L 406 152 L 40 152 Z" fill="url(#fill)"/>
  <path d="M 40 138 L 68 138 L 84 120 L 98 136 L 122 58 L 144 138 L 176 138 L 194 124 L 214 136 L 238 48 L 262 138 L 290 138 L 306 130 L 324 136 L 346 72 L 368 138 L 406 138" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="406" cy="138" r="5" fill="#a7f3d0"/>
  <text x="446" y="54" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">ECG Window</text>
  <text x="446" y="85" fill="#f9fafb" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700">73%</text>
  <text x="446" y="114" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="16">Local GPU activity</text>
  <text x="446" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Telemetry live</text>
</svg>
